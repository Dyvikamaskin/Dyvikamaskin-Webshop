name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR — saves CI minutes when pushing
# multiple commits in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  typecheck-and-unit:
    name: typecheck + unit tests + link audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Static link audit
        run: npm run audit:links

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  e2e-link-integrity:
    name: playwright link integrity smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: typecheck-and-unit

    # Opt-in. The link smoke test needs to boot the Next.js app, which
    # requires a real DATABASE_URL plus Supabase credentials. Until the
    # staging branch is wired up (see docs/staging-and-ci-setup.md),
    # leave this off. To turn it on:
    #   1. Configure GitHub repo secrets per docs/staging-and-ci-setup.md
    #   2. Repository → Settings → Secrets and variables → Actions →
    #      Variables tab → set E2E_ENABLED=true
    if: ${{ vars.E2E_ENABLED == 'true' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STAGING }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build

      - name: Run Playwright link integrity tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STAGING }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: |
          npm run start &
          SERVER_PID=$!
          # Wait for the server to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:3000 > /dev/null; then
              break
            fi
            sleep 2
          done
          npm run test:e2e
          kill $SERVER_PID || true

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
